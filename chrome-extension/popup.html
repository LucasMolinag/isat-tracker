<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ISAT Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div>
        <h1>ISAT Tracker</h1>
        <p class="sub">Jira survey mail → form + ticket</p>
      </div>
      <div class="header-actions">
        <button type="button" id="btn-refresh" class="btn btn-ghost" hidden>
          Refresh
        </button>
        <button type="button" id="btn-auth" class="btn btn-primary">
          Connect Google
        </button>
      </div>
    </header>

    <p id="status" class="status" role="status"></p>

    <ul id="list" class="list" aria-live="polite"></ul>

    <footer class="footer">
      <span id="meta"></span>
      <button type="button" id="btn-disconnect" class="linkish" hidden>
        Disconnect
      </button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
